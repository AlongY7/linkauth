<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Arctic Compass LinkAuth 密码重置 - 通过安全问题验证重置密码">
  <title>找回密码 - Arctic Compass LinkAuth</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/i18n.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/sm3.js"></script>
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
</head>
<body>
  <div class="auth-page">
    <div class="header-controls" style="position:fixed;top:16px;right:16px;z-index:1000;" data-header-controls></div>
    <div class="auth-container">
      <h1>找回密码</h1>
      <p class="subtitle">通过安全问题验证重置你的密码</p>

      <!-- Step 1: Enter Account -->
      <div id="step1">
        <form id="step1Form" novalidate>
          <div class="form-group">
            <label class="form-label" for="accountInput">登录账号</label>
            <input type="text" id="accountInput" class="form-input" placeholder="输入你的登录账号（如 Abc123@ArcticCompass_id）" required>
            <p class="form-hint">输入注册时使用的完整登录账号，例如 Abc123@ArcticCompass_id</p>
          </div>

          <div class="form-group hidden" id="step1Error">
            <div class="form-error" id="step1ErrorMessage"></div>
          </div>

          <button type="submit" class="btn btn-primary btn-block" id="step1Btn">
            <span class="spinner spinner-sm hidden" id="step1Spinner"></span>
            <span id="step1Text">下一步</span>
          </button>
        </form>
      </div>

      <!-- Step 2: Answer Security Questions -->
      <div id="step2" class="hidden">
        <form id="step2Form" novalidate>
          <p class="subtitle" style="margin-bottom:var(--spacing-lg);">请回答以下安全问题以验证身份</p>

          <div id="questionsContainer">
            <!-- Questions will be loaded here -->
          </div>

          <!-- New Password -->
          <div class="form-group">
            <label class="form-label" for="newPassword">新密码 <span class="required">*</span></label>
            <input type="password" id="newPassword" class="form-input" placeholder="输入新密码" required minlength="8" maxlength="64" autocomplete="new-password">
            <div class="password-strength" id="passwordStrength">
              <div class="bar"><div class="bar-fill" id="strengthBar"></div></div>
              <span class="label" id="strengthLabel">请输入密码（至少8位）</span>
            </div>
          </div>

          <div class="form-group">
            <label class="form-label" for="confirmPassword">确认新密码 <span class="required">*</span></label>
            <input type="password" id="confirmPassword" class="form-input" placeholder="再次输入新密码" required autocomplete="new-password">
          </div>

          <div class="form-group hidden" id="step2Error">
            <div class="form-error" id="step2ErrorMessage"></div>
          </div>

          <button type="submit" class="btn btn-primary btn-block" id="step2Btn">
            <span class="spinner spinner-sm hidden" id="step2Spinner"></span>
            <span id="step2Text">重置密码</span>
          </button>
        </form>
      </div>

      <!-- Step 3: Success -->
      <div id="step3" class="hidden">
        <div class="success-message">
          <h2>密码重置成功</h2>
          <p>你的密码已成功重置，请使用新密码登录。</p>
          <a href="login.html" class="btn btn-primary btn-block">前往登录</a>
        </div>
      </div>

      <p class="text-center mt-lg" style="color:var(--text-secondary);font-size:0.85rem;">
        返回 <a href="login.html">登录页面</a>
      </p>
      <p class="text-center mt-md" style="font-size:0.8rem;color:var(--text-secondary);">
        第三方应用开发者？<a href="/dev/">进入开发者控制台</a>
      </p>
    </div>
  </div>

  <script>
    (function () {
      'use strict';

      var currentAccount = '';

      var step1 = document.getElementById('step1');
      var step2 = document.getElementById('step2');
      var step3 = document.getElementById('step3');

      var step1Form = document.getElementById('step1Form');
      var accountInput = document.getElementById('accountInput');
      var step1Btn = document.getElementById('step1Btn');
      var step1Spinner = document.getElementById('step1Spinner');
      var step1Text = document.getElementById('step1Text');
      var step1Error = document.getElementById('step1Error');
      var step1ErrorMessage = document.getElementById('step1ErrorMessage');

      var questionsContainer = document.getElementById('questionsContainer');
      var step2Form = document.getElementById('step2Form');
      var newPasswordInput = document.getElementById('newPassword');
      var confirmInput = document.getElementById('confirmPassword');
      var strengthBar = document.getElementById('strengthBar');
      var strengthLabel = document.getElementById('strengthLabel');
      var step2Btn = document.getElementById('step2Btn');
      var step2Spinner = document.getElementById('step2Spinner');
      var step2Text = document.getElementById('step2Text');
      var step2Error = document.getElementById('step2Error');
      var step2ErrorMessage = document.getElementById('step2ErrorMessage');

      // ---- Password Strength ----
      function evaluatePasswordStrength(pwd) {
        if (!pwd) return { score: 0, label: '请输入密码（至少8位）', cls: '' };
        if (pwd.length < 8) return { score: 0, label: '密码长度不足8位', cls: '' };

        var score = 0;
        if (pwd.length >= 12) score += 1;
        if (pwd.length >= 16) score += 1;
        if (/[a-z]/.test(pwd) && /[A-Z]/.test(pwd)) score += 1;
        if (/\d/.test(pwd)) score += 1;
        if (/[^a-zA-Z0-9]/.test(pwd)) score += 1;

        if (score < 2) return { score: 1, label: '弱 - 建议增加长度和复杂度', cls: 'weak' };
        if (score < 4) return { score: 2, label: '中 - 可考虑增加特殊字符', cls: 'medium' };
        return { score: 3, label: '强 - 密码强度足够', cls: 'strong' };
      }

      newPasswordInput.addEventListener('input', function () {
        var result = evaluatePasswordStrength(this.value);
        strengthBar.className = 'bar-fill ' + result.cls;
        strengthLabel.textContent = result.label;
      });

      // ---- Step 1: Look up account ----
      step1Form.addEventListener('submit', async function (e) {
        e.preventDefault();

        var account = accountInput.value.trim();
        if (!account) {
          showStep1Error('请输入登录账号');
          return;
        }

        step1Btn.disabled = true;
        step1Spinner.classList.remove('hidden');
        step1Text.textContent = '验证中...';
        step1Error.classList.add('hidden');

        try {
          var result = await window.LinkAuthAPI.getSecurityQuestions({
            login_name: account
          });

          if (!result.questions || result.questions.length === 0) {
            showStep1Error('该账号未设置安全问题，无法通过此方式重置密码');
            return;
          }

          currentAccount = account;
          renderQuestions(result.questions);
          step1.classList.add('hidden');
          step2.classList.remove('hidden');

        } catch (err) {
          showStep1Error(err.message || '账号验证失败');
        } finally {
          step1Btn.disabled = false;
          step1Spinner.classList.add('hidden');
          step1Text.textContent = '下一步';
        }
      });

      function showStep1Error(msg) {
        step1ErrorMessage.textContent = msg;
        step1Error.classList.remove('hidden');
      }

      // ---- Render Security Questions ----
      function renderQuestions(questions) {
        questionsContainer.textContent = '';

        questions.forEach(function (q, idx) {
          var div = document.createElement('div');
          div.className = 'form-group';

          var label = document.createElement('label');
          label.className = 'form-label';
          label.setAttribute('for', 'answer_' + idx);
          label.textContent = '问题 ' + (idx + 1) + '：' + q.question_content;
          div.appendChild(label);

          var input = document.createElement('input');
          input.type = 'text';
          input.id = 'answer_' + idx;
          input.className = 'form-input answer-input';
          input.placeholder = '输入答案';
          input.required = true;
          input.maxLength = 256;
          input.setAttribute('data-sort', q.sort);
          div.appendChild(input);

          questionsContainer.appendChild(div);
        });
      }

      // ---- Step 2: Verify answers and reset password ----
      step2Form.addEventListener('submit', async function (e) {
        e.preventDefault();

        var newPassword = newPasswordInput.value;
        var confirmPassword = confirmInput.value;

        if (!newPassword || newPassword.length < 8) {
          showStep2Error('新密码长度至少8位');
          return;
        }

        if (newPassword !== confirmPassword) {
          showStep2Error('两次输入的密码不一致');
          return;
        }

        // Collect answers
        var answerInputs = questionsContainer.querySelectorAll('.answer-input');
        var answers = [];
        answerInputs.forEach(function (input) {
          answers.push({
            sort: parseInt(input.dataset.sort, 10),
            answer: input.value.trim()
          });
        });

        if (answers.some(function (a) { return !a.answer; })) {
          showStep2Error('请回答所有安全问题');
          return;
        }

        step2Btn.disabled = true;
        step2Spinner.classList.remove('hidden');
        step2Text.textContent = '重置中...';
        step2Error.classList.add('hidden');

        try {
          var result = await window.LinkAuthAPI.resetPassword({
            login_name: currentAccount,
            answers: answers,
            new_password: window.SM3.hash(newPassword)
          });

          if (result.message) {
            step2.classList.add('hidden');
            step3.classList.remove('hidden');
          }

        } catch (err) {
          showStep2Error(err.message || '密码重置失败');
        } finally {
          step2Btn.disabled = false;
          step2Spinner.classList.add('hidden');
          step2Text.textContent = '重置密码';
        }
      });

      function showStep2Error(msg) {
        step2ErrorMessage.textContent = msg;
        step2Error.classList.remove('hidden');
      }

    })();
  </script>
</body>
</html>
