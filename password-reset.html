<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>找回密码 - Arctic Compass LinkAuth</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/sm3.js"></script>
  <script src="js/linkauth-core.js"></script>
</head>
<body>
  <div class="auth-page">
    <div class="auth-container">
      <h1>找回密码</h1>
      <p class="subtitle">通过安全问题重置密码</p>

      <form id="resetForm" novalidate>
        <div class="form-group">
          <label class="form-label" for="linkId">账号ID</label>
          <input type="text" id="linkId" class="form-input" placeholder="如 Abc123@ArcticCompass_id" required>
        </div>

        <div id="questionsPanel" class="hidden">
          <div id="questionsContainer"></div>

          <div class="form-group">
            <label class="form-label" for="newPwd">新密码</label>
            <input type="password" id="newPwd" class="form-input" placeholder="至少6位" required minlength="6">
          </div>
        </div>

        <div class="form-group hidden" id="errorContainer">
          <div class="form-error" id="errorMessage"></div>
        </div>
        <div class="form-group hidden" id="successContainer">
          <div class="form-success" id="successMessage" style="color:var(--accent-success);padding:10px;background:var(--accent-success-light);border-radius:var(--border-radius);"></div>
        </div>

        <button type="submit" class="btn btn-primary btn-block" id="submitBtn">
          <span id="submitText">下一步</span>
        </button>
      </form>

      <p class="text-center mt-md" style="font-size:0.85rem;">
        <a href="login.html">返回登录</a>
      </p>
    </div>
  </div>

  <script>
    (function () {
      'use strict';
      var C = window.LinkAuthCore;
      var step = 1;

      var form = document.getElementById('resetForm');
      var linkIdEl = document.getElementById('linkId');
      var questionsPanel = document.getElementById('questionsPanel');
      var questionsContainer = document.getElementById('questionsContainer');
      var submitBtn = document.getElementById('submitBtn');
      var submitText = document.getElementById('submitText');
      var errorContainer = document.getElementById('errorContainer');
      var errorMessage = document.getElementById('errorMessage');
      var successContainer = document.getElementById('successContainer');
      var successMessage = document.getElementById('successMessage');

      function showError(msg) {
        errorMessage.textContent = msg;
        errorContainer.classList.remove('hidden');
      }

      form.addEventListener('submit', function (e) {
        e.preventDefault();
        errorContainer.classList.add('hidden');
        successContainer.classList.add('hidden');

        var linkId = linkIdEl.value.trim();
        if (!linkId) return showError('请输入账号ID');

        if (step === 1) {
          var questions = C.getSecurityQuestions(linkId);
          if (!questions || questions.length === 0) {
            return showError('该账号未设置安全问题，无法找回密码');
          }
          questionsContainer.innerHTML = questions.map(function (q, i) {
            return '<div class="form-group"><label class="form-label">' + q.question + '</label><input type="text" class="form-input sq-answer" placeholder="答案" required></div>';
          }).join('');
          questionsPanel.classList.remove('hidden');
          linkIdEl.disabled = true;
          submitText.textContent = '重置密码';
          step = 2;
        } else {
          var answers = [];
          document.querySelectorAll('.sq-answer').forEach(function (el) {
            answers.push(el.value.trim());
          });
          var newPwd = document.getElementById('newPwd').value;
          if (!newPwd || newPwd.length < 6) return showError('新密码至少6位');

          var r = C.resetPassword(linkId, answers, newPwd);
          if (!r.ok) return showError(r.error);

          successMessage.textContent = r.message + '，请使用新密码登录';
          successContainer.classList.remove('hidden');
          submitBtn.classList.add('hidden');
        }
      });
    })();
  </script>
</body>
</html>
