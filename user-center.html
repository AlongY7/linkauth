<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>用户中心 - Arctic Compass LinkAuth</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/sm3.js"></script>
  <script src="js/linkauth-core.js"></script>
</head>
<body>
  <div class="auth-page">
    <div class="auth-container" style="max-width:700px;">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
        <h1 style="margin:0;">用户中心</h1>
        <button id="logoutBtn" class="btn btn-outline" style="font-size:0.85rem;">退出登录</button>
      </div>

      <div id="loadingPanel"><p style="text-align:center;color:var(--text-secondary);">加载中...</p></div>

      <div id="mainPanel" class="hidden">
        <!-- 用户信息卡片 -->
        <div style="background:var(--bg-tertiary);padding:16px;border-radius:var(--border-radius);margin-bottom:20px;">
          <p style="margin:0 0 4px 0;"><strong id="profileLinkId"></strong></p>
          <p style="margin:0;font-size:0.85rem;color:var(--text-secondary);">
            角色：<span id="profileRole"></span> &middot; 状态：<span id="profileStatus"></span>
          </p>
          <p style="margin:4px 0 0 0;font-size:0.8rem;color:var(--text-tertiary);">
            管理密钥：<code id="profileKey" style="font-size:0.75rem;"></code>
          </p>
          <p id="tempInfo" style="margin:4px 0 0 0;font-size:0.8rem;color:var(--accent-warning);" class="hidden"></p>
        </div>

        <!-- 标签导航 -->
        <div style="display:flex;gap:0;border-bottom:2px solid var(--border-color);margin-bottom:20px;">
          <button class="tab-btn active" data-tab="security" style="flex:1;padding:10px;border:none;background:none;cursor:pointer;font-size:0.9rem;border-bottom:2px solid transparent;margin-bottom:-2px;">安全设置</button>
          <button class="tab-btn" data-tab="apps" style="flex:1;padding:10px;border:none;background:none;cursor:pointer;font-size:0.9rem;border-bottom:2px solid transparent;margin-bottom:-2px;">已授权应用</button>
          <button class="tab-btn" data-tab="notifications" style="flex:1;padding:10px;border:none;background:none;cursor:pointer;font-size:0.9rem;border-bottom:2px solid transparent;margin-bottom:-2px;">通知</button>
        </div>

        <div id="securityTab" class="tab-content">
          <h3>修改密码</h3>
          <form id="changePwdForm" novalidate>
            <div class="form-group">
              <label class="form-label" for="oldPassword">原密码</label>
              <input type="password" id="oldPassword" class="form-input" placeholder="输入原密码" required>
            </div>
            <div class="form-group">
              <label class="form-label" for="newPassword">新密码</label>
              <input type="password" id="newPassword" class="form-input" placeholder="至少6位" required minlength="6">
            </div>
            <button type="submit" class="btn btn-primary">修改密码</button>
            <span id="pwdMsg" style="margin-left:12px;font-size:0.85rem;"></span>
          </form>

          <h3 style="margin-top:24px;">更新安全问题</h3>
          <form id="updateSqForm" novalidate>
            <div id="sqContainer">
              <div class="sq-row" style="display:flex;gap:8px;margin-bottom:8px;">
                <select class="form-input sq-question" style="flex:1;">
                  <option value="">选择问题...</option>
                  <option value="你的出生城市是？">你的出生城市是？</option>
                  <option value="你的小学名称是？">你的小学名称是？</option>
                  <option value="你最喜欢的电影是？">你最喜欢的电影是？</option>
                  <option value="你的宠物名字是？">你的宠物名字是？</option>
                  <option value="你的母亲姓氏是？">你的母亲姓氏是？</option>
                </select>
                <input type="text" class="form-input sq-answer" placeholder="答案" style="flex:1;">
              </div>
              <div class="sq-row" style="display:flex;gap:8px;margin-bottom:8px;">
                <select class="form-input sq-question" style="flex:1;">
                  <option value="">选择问题...</option>
                  <option value="你的出生城市是？">你的出生城市是？</option>
                  <option value="你的小学名称是？">你的小学名称是？</option>
                  <option value="你最喜欢的电影是？">你最喜欢的电影是？</option>
                  <option value="你的宠物名字是？">你的宠物名字是？</option>
                  <option value="你的母亲姓氏是？">你的母亲姓氏是？</option>
                </select>
                <input type="text" class="form-input sq-answer" placeholder="答案" style="flex:1;">
              </div>
            </div>
            <button type="submit" class="btn btn-primary">更新安全问题</button>
            <span id="sqMsg" style="margin-left:12px;font-size:0.85rem;"></span>
          </form>
        </div>

        <div id="appsTab" class="tab-content hidden">
          <h3>已授权应用</h3>
          <div id="appsList"><p style="color:var(--text-secondary);">暂无已授权应用</p></div>
        </div>

        <div id="notificationsTab" class="tab-content hidden">
          <h3>通知列表</h3>
          <div id="notificationsList"><p style="color:var(--text-secondary);">暂无通知</p></div>
        </div>
      </div>

      <div id="loginPrompt" class="hidden" style="text-align:center;padding:40px;">
        <p style="color:var(--text-secondary);">请先登录</p>
        <a href="login.html" class="btn btn-primary">前往登录</a>
      </div>
    </div>
  </div>

  <script>
    (function () {
      'use strict';
      var C = window.LinkAuthCore;
      var session = C.getSession();
      if (!session) {
        document.getElementById('loadingPanel').classList.add('hidden');
        document.getElementById('loginPrompt').classList.remove('hidden');
        return;
      }

      var profile = C.getUserProfile(session.link_id);
      if (!profile) {
        C.clearSession();
        document.getElementById('loadingPanel').classList.add('hidden');
        document.getElementById('loginPrompt').classList.remove('hidden');
        return;
      }

      document.getElementById('loadingPanel').classList.add('hidden');
      document.getElementById('mainPanel').classList.remove('hidden');

      // 填充用户信息
      document.getElementById('profileLinkId').textContent = profile.link_id;
      document.getElementById('profileRole').textContent = profile.role === 'admin' ? '管理员' : (profile.role === 'temp' ? '临时用户' : '普通用户');
      document.getElementById('profileStatus').textContent = profile.status === 'active' ? '正常' : '已封禁';
      document.getElementById('profileKey').textContent = profile.manager_key || '无（临时账号）';

      if (profile.is_temp) {
        var ti = document.getElementById('tempInfo');
        ti.classList.remove('hidden');
        var exp = new Date(profile.temp_expires * 1000).toLocaleString();
        ti.textContent = '临时账号，过期时间：' + exp + ' | 已延期 ' + profile.temp_extend_count + '/3 次';
        if (profile.temp_extend_count < 3) {
          ti.innerHTML += ' <button id="extendBtn" class="btn btn-outline" style="font-size:0.75rem;padding:2px 8px;">延期</button>';
        }
      }

      // 标签切换
      document.querySelectorAll('.tab-btn').forEach(function (btn) {
        btn.addEventListener('click', function () {
          document.querySelectorAll('.tab-btn').forEach(function (b) { b.classList.remove('active'); b.style.color = ''; b.style.borderBottomColor = 'transparent'; });
          btn.classList.add('active');
          btn.style.color = 'var(--accent-primary)';
          btn.style.borderBottomColor = 'var(--accent-primary)';
          document.querySelectorAll('.tab-content').forEach(function (t) { t.classList.add('hidden'); });
          document.getElementById(btn.dataset.tab + 'Tab').classList.remove('hidden');
        });
      });
      // 初始激活样式
      var activeTab = document.querySelector('.tab-btn.active');
      if (activeTab) { activeTab.style.color = 'var(--accent-primary)'; activeTab.style.borderBottomColor = 'var(--accent-primary)'; }

      // 修改密码
      document.getElementById('changePwdForm').addEventListener('submit', function (e) {
        e.preventDefault();
        var r = C.changePassword(session.link_id, document.getElementById('oldPassword').value, document.getElementById('newPassword').value);
        var msg = document.getElementById('pwdMsg');
        msg.textContent = r.message || r.error;
        msg.style.color = r.ok ? 'var(--accent-success)' : 'var(--accent-danger)';
        if (r.ok) { document.getElementById('oldPassword').value = ''; document.getElementById('newPassword').value = ''; }
      });

      // 更新安全问题
      document.getElementById('updateSqForm').addEventListener('submit', function (e) {
        e.preventDefault();
        var qs = [];
        document.querySelectorAll('#sqContainer .sq-row').forEach(function (row) {
          var q = row.querySelector('.sq-question').value;
          var a = row.querySelector('.sq-answer').value.trim();
          if (q && a) qs.push({ question: q, answer: a });
        });
        if (qs.length < 2) {
          document.getElementById('sqMsg').textContent = '请至少设置2个安全问题';
          document.getElementById('sqMsg').style.color = 'var(--accent-danger)';
          return;
        }
        var r = C.updateSecurityQuestions(session.link_id, qs);
        var msg = document.getElementById('sqMsg');
        msg.textContent = r.message || r.error;
        msg.style.color = r.ok ? 'var(--accent-success)' : 'var(--accent-danger)';
      });

      // 已授权应用
      var apps = C.getAuthorizedApps(session.link_id);
      var appsList = document.getElementById('appsList');
      if (apps.length > 0) {
        appsList.innerHTML = apps.map(function (a) {
          return '<div style="display:flex;justify-content:space-between;align-items:center;padding:10px;border:1px solid var(--border-color);border-radius:var(--border-radius);margin-bottom:8px;">' +
            '<span>' + a.app_name + ' <small style="color:var(--text-tertiary);">(' + a.client_id + ')</small></span>' +
            '<button class="btn btn-outline revoke-btn" data-client="' + a.client_id + '" style="font-size:0.8rem;color:var(--accent-danger);">撤销</button></div>';
        }).join('');
      }

      // 通知
      var notifs = C.getNotifications(session.link_id);
      var notifsList = document.getElementById('notificationsList');
      if (notifs.length > 0) {
        notifsList.innerHTML = notifs.map(function (n) {
          return '<div style="padding:10px;border:1px solid var(--border-color);border-radius:var(--border-radius);margin-bottom:8px;' + (n.read ? 'opacity:0.6;' : '') + '">' +
            '<strong>' + n.title + '</strong> <small style="color:var(--text-tertiary);">' + new Date(n.created_at * 1000).toLocaleString() + '</small>' +
            '<p style="margin:4px 0 0 0;font-size:0.85rem;">' + n.body + '</p></div>';
        }).join('');
      }

      // 撤销授权
      document.addEventListener('click', function (e) {
        if (e.target.classList.contains('revoke-btn')) {
          C.revokeApp(session.link_id, e.target.dataset.client);
          e.target.closest('div').remove();
          if (appsList.children.length === 0) appsList.innerHTML = '<p style="color:var(--text-secondary);">暂无已授权应用</p>';
        }
      });

      // 临时账号延期
      var extendBtn = document.getElementById('extendBtn');
      if (extendBtn) {
        extendBtn.addEventListener('click', function () {
          var r = C.extendTempAccount(session.link_id);
          alert(r.message || r.error);
          if (r.ok) location.reload();
        });
      }

      // 退出
      document.getElementById('logoutBtn').addEventListener('click', function () {
        C.clearSession();
        window.location.href = 'login.html';
      });
    })();
  </script>
</body>
</html>
