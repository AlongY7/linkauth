<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录 - Arctic Compass LinkAuth</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/sm3.js"></script>
  <script src="js/linkauth-core.js"></script>
</head>
<body>
  <div class="auth-page">
    <div class="auth-container">
      <h1>登录 Arctic Compass LinkAuth</h1>
      <p class="subtitle">使用你的北极指南针身份登录</p>

      <form id="loginForm" novalidate>
        <div class="form-group">
          <label class="form-label" for="account">登录账号</label>
          <input type="text" id="account" class="form-input" placeholder="Abc123@ArcticCompass_id" required autocomplete="username">
          <p class="form-hint">格式：前缀 + 后缀，如 Abc123@ArcticCompass_id、MyAI@ArcticCompass_ai</p>
        </div>

        <div class="form-group">
          <label class="form-label" for="password">密码</label>
          <input type="password" id="password" class="form-input" placeholder="输入密码" required autocomplete="current-password">
        </div>

        <div class="form-group hidden" id="errorContainer">
          <div class="form-error" id="errorMessage"></div>
        </div>

        <button type="submit" class="btn btn-primary btn-block" id="submitBtn">
          <span id="submitText">登录</span>
        </button>
      </form>

      <div class="flex-between mt-lg" style="font-size:0.85rem;">
        <a href="register.html">创建账号</a>
        <a href="password-reset.html">找回密码</a>
      </div>

      <div class="mt-md" style="display:flex;flex-direction:column;gap:8px;">
        <a href="temp-login.html" class="btn btn-outline btn-block" style="text-align:center;text-decoration:none;">一键临时登录</a>
        <a href="manager-key-recovery.html" class="btn btn-outline btn-block" style="text-align:center;text-decoration:none;">找回管理密钥</a>
        <a href="user-center.html" class="btn btn-secondary btn-block" style="text-align:center;text-decoration:none;">进入用户中心</a>
      </div>

      <p class="text-center mt-md" style="font-size:0.8rem;color:var(--text-secondary);">
        <a href="admin-console.html">后台管理登录</a>
      </p>
    </div>
  </div>

  <div class="toast-container" id="toastContainer"></div>

  <script>
    (function () {
      'use strict';
      var C = window.LinkAuthCore;

      var form = document.getElementById('loginForm');
      var accountEl = document.getElementById('account');
      var passwordEl = document.getElementById('password');
      var submitBtn = document.getElementById('submitBtn');
      var submitText = document.getElementById('submitText');
      var errorContainer = document.getElementById('errorContainer');
      var errorMessage = document.getElementById('errorMessage');

      // 解析 URL 参数
      function qp() {
        var p = {};
        (window.location.search.substring(1) || '').split('&').forEach(function (pair) {
          var parts = pair.split('=');
          if (parts.length === 2) p[decodeURIComponent(parts[0])] = decodeURIComponent(parts[1]);
        });
        return p;
      }
      var params = qp();

      function showError(msg) {
        errorMessage.textContent = msg;
        errorContainer.classList.remove('hidden');
      }

      form.addEventListener('submit', function (e) {
        e.preventDefault();
        errorContainer.classList.add('hidden');

        var account = accountEl.value.trim();
        var password = passwordEl.value;

        if (!account) return showError('请输入登录账号');
        if (!password) return showError('请输入密码');

        submitBtn.disabled = true;
        submitText.textContent = '登录中...';

        // 模拟微小延迟，让用户感知
        setTimeout(function () {
          var result = C.login(account, password);

          if (!result.ok) {
            showError(result.error);
            submitBtn.disabled = false;
            submitText.textContent = '登录';
            return;
          }

          // 检查 OAuth 参数
          var clientId = params.client_id;
          var redirectUri = params.redirect_uri;
          var state = params.state;

          if (clientId && redirectUri) {
            // 检查应用是否已授权
            if (C.isAppAuthorized(result.link_id, clientId)) {
              // 已授权，直接生成 code 并跳转
              var code = C.createAuthCode(clientId, result.link_id);
              var sep = redirectUri.indexOf('?') > -1 ? '&' : '?';
              window.location.href = redirectUri + sep + 'code=' + encodeURIComponent(code) + '&state=' + encodeURIComponent(state || '');
            } else {
              // 未授权，跳转到授权页
              var authUrl = 'authorize.html?client_id=' + encodeURIComponent(clientId) +
                '&redirect_uri=' + encodeURIComponent(redirectUri) +
                '&state=' + encodeURIComponent(state || '') +
                '&link_id=' + encodeURIComponent(result.link_id);
              window.location.href = authUrl;
            }
          } else {
            // 直接登录，跳转到用户中心
            window.location.href = 'user-center.html';
          }
        }, 300);
      });

      // 清除错误
      accountEl.addEventListener('input', function () { errorContainer.classList.add('hidden'); });
      passwordEl.addEventListener('input', function () { errorContainer.classList.add('hidden'); });
    })();
  </script>
</body>
</html>
