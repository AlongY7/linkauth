<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Arctic Compass LinkAuth 用户登录">
  <title>登录 - Arctic Compass LinkAuth</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/i18n.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/sm3.js"></script>
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
</head>
<body>
  <div class="auth-page">
    <div class="header-controls" style="position:fixed;top:16px;right:16px;z-index:1000;" data-header-controls></div>
    <div class="auth-container">
      <h1>登录 Arctic Compass LinkAuth</h1>
      <p class="subtitle">使用你的北极指南针身份登录</p>

      <form id="loginForm" novalidate>
        <!-- Account -->
        <div class="form-group">
          <label class="form-label" for="account">登录账号</label>
          <input type="text" id="account" class="form-input" placeholder="输入登录账号（如 Abc123@ArcticCompass_id）" required autocomplete="username">
          <p class="form-hint">登录账号格式：前缀 + 后缀之一，例如 Abc123@ArcticCompass_id、MyAI@ArcticCompass_ai</p>
        </div>

        <!-- Password -->
        <div class="form-group">
          <label class="form-label" for="password">密码</label>
          <input type="password" id="password" class="form-input" placeholder="输入密码" required autocomplete="current-password">
        </div>

        <!-- Error Display -->
        <div class="form-group hidden" id="errorContainer">
          <div class="form-error" id="errorMessage"></div>
          <div class="form-error hidden" id="rateLimitMessage" style="margin-top:var(--spacing-sm);"></div>
        </div>

        <button type="submit" class="btn btn-primary btn-block" id="submitBtn">
          <span class="spinner spinner-sm hidden" id="submitSpinner"></span>
          <span id="submitText">登录</span>
        </button>
      </form>

      <!-- Quick Links -->
      <div class="flex-between mt-lg" style="font-size:0.85rem;">
        <a href="register.html">创建账号</a>
        <a href="password-reset.html" id="forgotPasswordLink">找回密码</a>
      </div>

      <!-- Action Buttons -->
      <div class="mt-md" style="display:flex;flex-direction:column;gap:8px;">
        <a href="temp-login.html" class="btn btn-outline btn-block" style="text-align:center;text-decoration:none;">
          一键临时登录
        </a>
        <a href="manager-key-recovery.html" class="btn btn-outline btn-block" style="text-align:center;text-decoration:none;">
          找回管理密钥
        </a>
        <a href="user-center.html" class="btn btn-secondary btn-block" style="text-align:center;text-decoration:none;">
          进入用户中心
        </a>
      </div>

      <p class="text-center mt-md" style="font-size:0.8rem;color:var(--text-secondary);">
        第三方应用开发者？<a href="/dev/">进入开发者控制台</a>
      </p>
      <p class="text-center" style="font-size:0.8rem;color:var(--text-secondary);">
        <a href="admin-console.html">后台管理登录</a> &middot; <a href="/dev/">开发者注册</a>
      </p>
    </div>
  </div>

  <script>
    (function () {
      'use strict';

      var form = document.getElementById('loginForm');
      var accountInput = document.getElementById('account');
      var passwordInput = document.getElementById('password');
      var submitBtn = document.getElementById('submitBtn');
      var submitSpinner = document.getElementById('submitSpinner');
      var submitText = document.getElementById('submitText');
      var errorContainer = document.getElementById('errorContainer');
      var errorMessage = document.getElementById('errorMessage');
      var rateLimitMessage = document.getElementById('rateLimitMessage');

      // ---- Parse OAuth parameters from URL ----
      function getQueryParams() {
        var params = {};
        var search = window.location.search.substring(1);
        if (!search) return params;
        search.split('&').forEach(function (pair) {
          var parts = pair.split('=');
          if (parts.length === 2) {
            params[decodeURIComponent(parts[0])] = decodeURIComponent(parts[1]);
          }
        });
        return params;
      }

      var queryParams = getQueryParams();

      // ---- Form Validation ----
      function validateForm() {
        if (!accountInput.value.trim()) {
          return '请输入登录账号（如 Abc123@ArcticCompass_id）';
        }
        if (!passwordInput.value) {
          return '请输入密码';
        }
        return null;
      }

      // ---- Form Submission ----
      form.addEventListener('submit', async function (e) {
        e.preventDefault();

        var error = validateForm();
        if (error) {
          showError(error);
          return;
        }

        // Hide previous errors
        errorContainer.classList.add('hidden');
        rateLimitMessage.classList.add('hidden');

        // Hash password with SM3
        var hashedPassword = window.SM3.hash(passwordInput.value);

        // Set loading state
        submitBtn.disabled = true;
        submitSpinner.classList.remove('hidden');
        submitText.textContent = '登录中...';

        try {
          // Check if OAuth params exist
          var clientId = queryParams.client_id;
          var state = queryParams.state;
          var redirectUri = queryParams.redirect_uri;

          if (clientId && state && redirectUri) {
            // OAuth login flow
            var result = await window.LinkAuthAPI.login({
              login_account: accountInput.value.trim(),
              password: hashedPassword,
              client_id: clientId,
              state: state,
              redirect_uri: redirectUri
            });

            // Redirect to the app's callback URL
            if (result.redirect_url) {
              window.location.href = result.redirect_url;
            }
          } else {
            // Direct login - just verify credentials
            var result = await window.LinkAuthAPI.loginSimple({
              login_account: accountInput.value.trim(),
              password_hash: hashedPassword
            });

            // Store session info
            if (result.link_id) {
              sessionStorage.setItem('link_id', result.link_id);
            }
            if (result.token) {
              sessionStorage.setItem('auth_token', result.token);
            }

            // Check if there's redirect URL from OAuth flow
            var storedRedirect = sessionStorage.getItem('oauth_redirect');
            if (storedRedirect) {
              sessionStorage.removeItem('oauth_redirect');
              window.location.href = storedRedirect;
            } else {
              // Redirect to user center
              window.location.href = 'user-center.html';
            }
          }

        } catch (err) {
          showError(err.message || '登录失败');

          // Check for rate limit info
          if (err.data && err.data.retry_after) {
            rateLimitMessage.textContent = '请等待 ' + err.data.retry_after + ' 秒后重试';
            rateLimitMessage.classList.remove('hidden');
          }
        } finally {
          submitBtn.disabled = false;
          submitSpinner.classList.add('hidden');
          submitText.textContent = '登录';
        }
      });

      // ---- Error Display ----
      function showError(msg) {
        errorMessage.textContent = msg;
        errorContainer.classList.remove('hidden');
      }

      // ---- Toast Helper ----
      function showToast(message, type) {
        type = type || 'info';
        var container = document.querySelector('.toast-container');
        if (!container) {
          container = document.createElement('div');
          container.className = 'toast-container';
          document.body.appendChild(container);
        }

        var toast = document.createElement('div');
        toast.className = 'toast ' + type;

        var icons = { success: '\u2713', error: '\u2717', warning: '\u26A0', info: '\u2139' };
        toast.innerHTML =
          '<span class="toast-icon">' + (icons[type] || '') + '</span>' +
          '<span class="toast-message"></span>' +
          '<button class="toast-close">&times;</button>';
        toast.querySelector('.toast-message').textContent = message;

        toast.querySelector('.toast-close').addEventListener('click', function () {
          toast.remove();
        });

        container.appendChild(toast);

        setTimeout(function () {
          if (toast.parentNode) toast.remove();
        }, 5000);
      }

      // Clear error on input
      accountInput.addEventListener('input', function () {
        errorContainer.classList.add('hidden');
      });
      passwordInput.addEventListener('input', function () {
        errorContainer.classList.add('hidden');
      });

    })();
  </script>
</body>
</html>
