<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>后台管理 - Arctic Compass LinkAuth</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/sm3.js"></script>
  <script src="js/linkauth-core.js"></script>
</head>
<body>
  <div class="auth-page">
    <div class="auth-container" style="max-width:800px;">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
        <h1 style="margin:0;">后台管理控制台</h1>
        <button id="logoutBtn" class="btn btn-outline" style="font-size:0.85rem;">退出</button>
      </div>

      <!-- 登录面板 -->
      <div id="loginPanel">
        <p class="subtitle">请输入管理员密钥</p>
        <form id="adminLoginForm" novalidate>
          <div class="form-group">
            <input type="password" id="adminKey" class="form-input" placeholder="管理员密钥" required>
          </div>
          <div class="form-group hidden" id="loginError">
            <div class="form-error" id="loginErrorMessage"></div>
          </div>
          <button type="submit" class="btn btn-primary btn-block">登录后台</button>
        </form>
        <p class="text-center mt-md" style="font-size:0.85rem;">
          <a href="login.html">返回用户登录</a>
        </p>
      </div>

      <!-- 管理面板 -->
      <div id="adminPanel" class="hidden">
        <!-- 标签导航 -->
        <div style="display:flex;gap:0;border-bottom:2px solid var(--border-color);margin-bottom:20px;">
          <button class="tab-btn active" data-tab="users" style="flex:1;padding:10px;border:none;background:none;cursor:pointer;font-size:0.9rem;border-bottom:2px solid transparent;margin-bottom:-2px;">用户管理</button>
          <button class="tab-btn" data-tab="apps" style="flex:1;padding:10px;border:none;background:none;cursor:pointer;font-size:0.9rem;border-bottom:2px solid transparent;margin-bottom:-2px;">应用管理</button>
          <button class="tab-btn" data-tab="broadcast" style="flex:1;padding:10px;border:none;background:none;cursor:pointer;font-size:0.9rem;border-bottom:2px solid transparent;margin-bottom:-2px;">广播通知</button>
        </div>

        <!-- 用户管理 -->
        <div id="usersTab" class="tab-content">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
            <h3 style="margin:0;">用户列表</h3>
            <span id="userCount" style="font-size:0.85rem;color:var(--text-secondary);"></span>
          </div>
          <div id="userTable" style="overflow-x:auto;">
            <table style="width:100%;border-collapse:collapse;font-size:0.85rem;">
              <thead>
                <tr style="border-bottom:2px solid var(--border-color);text-align:left;">
                  <th style="padding:8px;">账号ID</th>
                  <th style="padding:8px;">角色</th>
                  <th style="padding:8px;">状态</th>
                  <th style="padding:8px;">类型</th>
                  <th style="padding:8px;">注册时间</th>
                  <th style="padding:8px;">操作</th>
                </tr>
              </thead>
              <tbody id="userTableBody"></tbody>
            </table>
          </div>
        </div>

        <!-- 应用管理 -->
        <div id="appsTab" class="tab-content hidden">
          <h3>OAuth 应用列表</h3>
          <button id="addAppBtn" class="btn btn-primary" style="margin-bottom:12px;font-size:0.85rem;">+ 注册新应用</button>
          <div id="appTable" style="overflow-x:auto;">
            <table style="width:100%;border-collapse:collapse;font-size:0.85rem;">
              <thead>
                <tr style="border-bottom:2px solid var(--border-color);text-align:left;">
                  <th style="padding:8px;">Client ID</th>
                  <th style="padding:8px;">应用名称</th>
                  <th style="padding:8px;">类型</th>
                  <th style="padding:8px;">回调地址</th>
                  <th style="padding:8px;">操作</th>
                </tr>
              </thead>
              <tbody id="appTableBody"></tbody>
            </table>
          </div>

          <!-- 添加应用表单 -->
          <div id="addAppForm" class="hidden" style="margin-top:16px;padding:16px;background:var(--bg-tertiary);border-radius:var(--border-radius);">
            <h4>注册新应用</h4>
            <div class="form-group">
              <label class="form-label">应用名称</label>
              <input type="text" id="newAppName" class="form-input" placeholder="我的应用">
            </div>
            <div class="form-group">
              <label class="form-label">Client ID（可选，留空自动生成）</label>
              <input type="text" id="newAppClientId" class="form-input" placeholder="my_app_v1">
            </div>
            <div class="form-group">
              <label class="form-label">应用描述</label>
              <input type="text" id="newAppDesc" class="form-input" placeholder="应用描述">
            </div>
            <div class="form-group">
              <label class="form-label">回调地址（每行一个）</label>
              <textarea id="newAppRedirectUris" class="form-input" rows="3" placeholder="https://example.com/callback"></textarea>
            </div>
            <div style="display:flex;gap:8px;">
              <button id="saveAppBtn" class="btn btn-primary">保存</button>
              <button id="cancelAppBtn" class="btn btn-outline">取消</button>
            </div>
            <span id="appMsg" style="margin-left:12px;font-size:0.85rem;"></span>
          </div>
        </div>

        <!-- 广播通知 -->
        <div id="broadcastTab" class="tab-content hidden">
          <h3>发送广播通知</h3>
          <form id="broadcastForm" novalidate>
            <div class="form-group">
              <label class="form-label">通知标题</label>
              <input type="text" id="broadcastTitle" class="form-input" placeholder="系统维护通知" required>
            </div>
            <div class="form-group">
              <label class="form-label">通知内容</label>
              <textarea id="broadcastBody" class="form-input" rows="4" placeholder="通知内容..." required></textarea>
            </div>
            <div class="form-group">
              <label class="form-label">通知类型</label>
              <select id="broadcastType" class="form-input">
                <option value="info">信息</option>
                <option value="warning">警告</option>
                <option value="danger">重要</option>
              </select>
            </div>
            <button type="submit" class="btn btn-primary">发送给所有用户</button>
            <span id="broadcastMsg" style="margin-left:12px;font-size:0.85rem;"></span>
          </form>
        </div>
      </div>
    </div>
  </div>

  <script>
    (function () {
      'use strict';
      var C = window.LinkAuthCore;

      var loginPanel = document.getElementById('loginPanel');
      var adminPanel = document.getElementById('adminPanel');

      // 检查是否已登录管理员
      var session = C.getSession();
      if (session && session.role === 'admin') {
        loginPanel.classList.add('hidden');
        adminPanel.classList.remove('hidden');
        renderAll();
      }

      // 管理员登录
      document.getElementById('adminLoginForm').addEventListener('submit', function (e) {
        e.preventDefault();
        var key = document.getElementById('adminKey').value;
        var r = C.adminLogin(key);
        if (!r.ok) {
          document.getElementById('loginErrorMessage').textContent = r.error;
          document.getElementById('loginError').classList.remove('hidden');
          return;
        }
        loginPanel.classList.add('hidden');
        adminPanel.classList.remove('hidden');
        renderAll();
      });

      // 退出
      document.getElementById('logoutBtn').addEventListener('click', function () {
        C.clearSession();
        window.location.reload();
      });

      // 标签切换
      document.querySelectorAll('.tab-btn').forEach(function (btn) {
        btn.addEventListener('click', function () {
          document.querySelectorAll('.tab-btn').forEach(function (b) { b.classList.remove('active'); b.style.color = ''; b.style.borderBottomColor = 'transparent'; });
          btn.classList.add('active');
          btn.style.color = 'var(--accent-primary)';
          btn.style.borderBottomColor = 'var(--accent-primary)';
          document.querySelectorAll('.tab-content').forEach(function (t) { t.classList.add('hidden'); });
          document.getElementById(btn.dataset.tab + 'Tab').classList.remove('hidden');
        });
      });
      var at = document.querySelector('.tab-btn.active');
      if (at) { at.style.color = 'var(--accent-primary)'; at.style.borderBottomColor = 'var(--accent-primary)'; }

      function renderAll() {
        renderUsers();
        renderApps();
      }

      function renderUsers() {
        var users = C.getAllUsers();
        document.getElementById('userCount').textContent = '共 ' + users.length + ' 个用户';
        document.getElementById('userTableBody').innerHTML = users.map(function (u) {
          var roleLabel = u.role === 'admin' ? '管理员' : (u.role === 'temp' ? '临时' : '用户');
          var statusLabel = u.status === 'active' ? '正常' : '已封禁';
          var statusColor = u.status === 'active' ? 'var(--accent-success)' : 'var(--accent-danger)';
          var typeLabel = u.is_temp ? '临时' : '正式';
          var dateStr = new Date(u.created_at * 1000).toLocaleDateString();
          var banText = u.role === 'admin' ? '' : (u.status === 'active' ? '封禁' : '解封');
          var delText = u.role === 'admin' ? '' : '删除';
          return '<tr style="border-bottom:1px solid var(--border-color);">' +
            '<td style="padding:8px;">' + u.link_id + '</td>' +
            '<td style="padding:8px;">' + roleLabel + '</td>' +
            '<td style="padding:8px;color:' + statusColor + ';">' + statusLabel + '</td>' +
            '<td style="padding:8px;">' + typeLabel + '</td>' +
            '<td style="padding:8px;">' + dateStr + '</td>' +
            '<td style="padding:8px;">' +
            (banText ? '<button class="btn btn-outline ban-btn" data-id="' + u.link_id + '" style="font-size:0.75rem;padding:2px 6px;margin-right:4px;">' + banText + '</button>' : '') +
            (delText ? '<button class="btn btn-outline del-btn" data-id="' + u.link_id + '" style="font-size:0.75rem;padding:2px 6px;color:var(--accent-danger);">' + delText + '</button>' : '') +
            '</td></tr>';
        }).join('');

        // 绑定操作
        document.querySelectorAll('.ban-btn').forEach(function (btn) {
          btn.addEventListener('click', function () {
            C.toggleUserBan(btn.dataset.id);
            renderUsers();
          });
        });
        document.querySelectorAll('.del-btn').forEach(function (btn) {
          btn.addEventListener('click', function () {
            if (confirm('确定删除用户 ' + btn.dataset.id + ' 吗？此操作不可撤销！')) {
              C.deleteUser(btn.dataset.id);
              renderUsers();
            }
          });
        });
      }

      function renderApps() {
        var apps = C.getAllApps();
        document.getElementById('appTableBody').innerHTML = apps.map(function (a) {
          return '<tr style="border-bottom:1px solid var(--border-color);">' +
            '<td style="padding:8px;"><code style="font-size:0.75rem;">' + a.client_id + '</code></td>' +
            '<td style="padding:8px;">' + a.app_name + '</td>' +
            '<td style="padding:8px;">' + a.app_type + '</td>' +
            '<td style="padding:8px;font-size:0.75rem;">' + (a.redirect_uris || []).join('<br>') + '</td>' +
            '<td style="padding:8px;"><button class="btn btn-outline del-app-btn" data-id="' + a.client_id + '" style="font-size:0.75rem;padding:2px 6px;color:var(--accent-danger);">删除</button></td>' +
            '</tr>';
        }).join('');

        document.querySelectorAll('.del-app-btn').forEach(function (btn) {
          btn.addEventListener('click', function () {
            C.deleteApp(btn.dataset.id);
            renderApps();
          });
        });
      }

      // 添加应用
      document.getElementById('addAppBtn').addEventListener('click', function () {
        document.getElementById('addAppForm').classList.remove('hidden');
      });
      document.getElementById('cancelAppBtn').addEventListener('click', function () {
        document.getElementById('addAppForm').classList.add('hidden');
      });
      document.getElementById('saveAppBtn').addEventListener('click', function () {
        var name = document.getElementById('newAppName').value.trim();
        var clientId = document.getElementById('newAppClientId').value.trim();
        var desc = document.getElementById('newAppDesc').value.trim();
        var uris = document.getElementById('newAppRedirectUris').value.split('\n').filter(function (l) { return l.trim(); });
        if (!name) { document.getElementById('appMsg').textContent = '请输入应用名称'; return; }
        if (uris.length === 0) { document.getElementById('appMsg').textContent = '请至少输入一个回调地址'; return; }
        var r = C.registerApp({ app_name: name, client_id: clientId || undefined, app_desc: desc, redirect_uris: uris });
        var msg = document.getElementById('appMsg');
        msg.textContent = '应用已创建：' + r.app.client_id;
        msg.style.color = 'var(--accent-success)';
        document.getElementById('addAppForm').classList.add('hidden');
        renderApps();
      });

      // 广播通知
      document.getElementById('broadcastForm').addEventListener('submit', function (e) {
        e.preventDefault();
        var title = document.getElementById('broadcastTitle').value.trim();
        var body = document.getElementById('broadcastBody').value.trim();
        var type = document.getElementById('broadcastType').value;
        if (!title || !body) return;
        var users = C.getAllUsers();
        var count = 0;
        users.forEach(function (u) {
          if (C.addNotification(u.link_id, title, body, type)) count++;
        });
        var msg = document.getElementById('broadcastMsg');
        msg.textContent = '已向 ' + count + ' 个用户发送通知';
        msg.style.color = 'var(--accent-success)';
        document.getElementById('broadcastTitle').value = '';
        document.getElementById('broadcastBody').value = '';
      });
    })();
  </script>
</body>
</html>
