<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>注册 - Arctic Compass LinkAuth</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/sm3.js"></script>
  <script src="js/linkauth-core.js"></script>
</head>
<body>
  <div class="auth-page">
    <div class="auth-container">
      <h1>注册 Arctic Compass 账号</h1>
      <p class="subtitle">创建你的北极指南针身份</p>

      <form id="registerForm" novalidate>
        <!-- 前缀 -->
        <div class="form-group">
          <label class="form-label" for="prefix">账号前缀（自定义）</label>
          <input type="text" id="prefix" class="form-input" placeholder="如 Abc123、MyAI" required>
          <p class="form-hint">3-20位字母数字组合，系统会自动拼接后缀</p>
        </div>

        <!-- 后缀选择 -->
        <div class="form-group">
          <label class="form-label">账号后缀</label>
          <div style="display:flex;flex-wrap:wrap;gap:8px;">
            <label class="chip-radio"><input type="radio" name="suffix" value="@ArcticCompass_id" checked><span>@ArcticCompass_id <small>通用</small></span></label>
            <label class="chip-radio"><input type="radio" name="suffix" value="@ArcticCompass_user"><span>@ArcticCompass_user <small>个人</small></span></label>
            <label class="chip-radio"><input type="radio" name="suffix" value="@ArcticCompass_dev"><span>@ArcticCompass_dev <small>开发者</small></span></label>
            <label class="chip-radio"><input type="radio" name="suffix" value="@ArcticCompass_ai"><span>@ArcticCompass_ai <small>AI</small></span></label>
            <label class="chip-radio"><input type="radio" name="suffix" value="@ArcticCompass_ent"><span>@ArcticCompass_ent <small>企业</small></span></label>
            <label class="chip-radio"><input type="radio" name="suffix" value="@ArcticCompass_org"><span>@ArcticCompass_org <small>组织</small></span></label>
          </div>
        </div>

        <!-- 预览 -->
        <div class="form-group">
          <label class="form-label">完整账号预览</label>
          <div id="preview" class="form-preview" style="padding:10px;background:var(--bg-tertiary);border-radius:var(--border-radius);font-family:var(--font-mono);font-size:1rem;word-break:break-all;">Abc123@ArcticCompass_id</div>
        </div>

        <!-- 密码 -->
        <div class="form-group">
          <label class="form-label" for="password">密码</label>
          <input type="password" id="password" class="form-input" placeholder="至少6位" required autocomplete="new-password" minlength="6">
          <p class="form-hint">至少6位字符</p>
        </div>

        <div class="form-group">
          <label class="form-label" for="confirmPassword">确认密码</label>
          <input type="password" id="confirmPassword" class="form-input" placeholder="再次输入密码" required autocomplete="new-password">
        </div>

        <!-- 安全问题 -->
        <div class="form-group">
          <label class="form-label">安全问题（用于找回密码和管理密钥）</label>
          <div id="securityQuestions">
            <div class="sq-row" style="display:flex;gap:8px;margin-bottom:8px;">
              <select class="form-input sq-question" style="flex:1;">
                <option value="">选择问题...</option>
                <option value="你的出生城市是？">你的出生城市是？</option>
                <option value="你的小学名称是？">你的小学名称是？</option>
                <option value="你最喜欢的电影是？">你最喜欢的电影是？</option>
                <option value="你的宠物名字是？">你的宠物名字是？</option>
                <option value="你的母亲姓氏是？">你的母亲姓氏是？</option>
              </select>
              <input type="text" class="form-input sq-answer" placeholder="答案" style="flex:1;">
            </div>
            <div class="sq-row" style="display:flex;gap:8px;margin-bottom:8px;">
              <select class="form-input sq-question" style="flex:1;">
                <option value="">选择问题...</option>
                <option value="你的出生城市是？">你的出生城市是？</option>
                <option value="你的小学名称是？">你的小学名称是？</option>
                <option value="你最喜欢的电影是？">你最喜欢的电影是？</option>
                <option value="你的宠物名字是？">你的宠物名字是？</option>
                <option value="你的母亲姓氏是？">你的母亲姓氏是？</option>
              </select>
              <input type="text" class="form-input sq-answer" placeholder="答案" style="flex:1;">
            </div>
          </div>
        </div>

        <div class="form-group hidden" id="errorContainer">
          <div class="form-error" id="errorMessage"></div>
        </div>

        <button type="submit" class="btn btn-primary btn-block" id="submitBtn">
          <span id="submitText">注册</span>
        </button>
      </form>

      <div class="text-center mt-lg" style="font-size:0.85rem;">
        已有账号？<a href="login.html">立即登录</a>
      </div>

      <div id="successPanel" class="hidden" style="margin-top:20px;padding:20px;background:var(--accent-success-light);border-radius:var(--border-radius-lg);">
        <h3 style="color:var(--accent-success);">注册成功！</h3>
        <p id="successAccount"></p>
        <p style="color:var(--accent-danger);font-weight:bold;" id="successKey"></p>
        <p style="font-size:0.85rem;color:var(--text-secondary);">请务必妥善保管上面的管理密钥，它不会再次显示。</p>
        <a href="login.html" class="btn btn-primary btn-block mt-md" style="text-align:center;text-decoration:none;">前往登录</a>
      </div>
    </div>
  </div>

  <script>
    (function () {
      'use strict';
      var C = window.LinkAuthCore;

      var prefixEl = document.getElementById('prefix');
      var previewEl = document.getElementById('preview');
      var form = document.getElementById('registerForm');
      var submitBtn = document.getElementById('submitBtn');
      var submitText = document.getElementById('submitText');
      var errorContainer = document.getElementById('errorContainer');
      var errorMessage = document.getElementById('errorMessage');
      var successPanel = document.getElementById('successPanel');

      function getSuffix() {
        var sel = document.querySelector('input[name="suffix"]:checked');
        return sel ? sel.value : '@ArcticCompass_id';
      }

      function updatePreview() {
        var prefix = prefixEl.value.trim() || 'Abc123';
        previewEl.textContent = prefix + getSuffix();
      }

      prefixEl.addEventListener('input', updatePreview);
      document.querySelectorAll('input[name="suffix"]').forEach(function (r) {
        r.addEventListener('change', updatePreview);
      });

      function showError(msg) {
        errorMessage.textContent = msg;
        errorContainer.classList.remove('hidden');
      }

      form.addEventListener('submit', function (e) {
        e.preventDefault();
        errorContainer.classList.add('hidden');

        var prefix = prefixEl.value.trim();
        var password = document.getElementById('password').value;
        var confirmPassword = document.getElementById('confirmPassword').value;

        if (!prefix) return showError('请输入账号前缀');
        if (!/^[a-zA-Z0-9]{3,20}$/.test(prefix)) return showError('前缀必须是3-20位字母数字组合');
        if (!password || password.length < 6) return showError('密码至少6位');
        if (password !== confirmPassword) return showError('两次密码不一致');

        // 收集安全问题
        var questions = [];
        document.querySelectorAll('.sq-row').forEach(function (row) {
          var q = row.querySelector('.sq-question').value;
          var a = row.querySelector('.sq-answer').value.trim();
          if (q && a) questions.push({ question: q, answer: a });
        });
        if (questions.length < 2) return showError('请至少设置2个安全问题');

        submitBtn.disabled = true;
        submitText.textContent = '注册中...';

        setTimeout(function () {
          var result = C.register({
            link_id: prefix + getSuffix(),
            password: password,
            security_questions: questions,
          });

          if (!result.ok) {
            showError(result.error);
            submitBtn.disabled = false;
            submitText.textContent = '注册';
            return;
          }

          form.classList.add('hidden');
          successPanel.classList.remove('hidden');
          document.getElementById('successAccount').textContent = '账号：' + result.link_id;
          document.getElementById('successKey').textContent = '管理密钥：' + result.manager_key;
        }, 300);
      });
    })();
  </script>
  <style>
    .chip-radio { position:relative; cursor:pointer; }
    .chip-radio input { position:absolute; opacity:0; }
    .chip-radio span { display:inline-block; padding:6px 12px; border:1px solid var(--border-color); border-radius:20px; font-size:0.85rem; transition:all 0.2s; }
    .chip-radio span small { color:var(--text-tertiary); font-size:0.75rem; }
    .chip-radio input:checked + span { background:var(--accent-primary); color:#fff; border-color:var(--accent-primary); }
    .chip-radio input:checked + span small { color:rgba(255,255,255,0.7); }
    .form-preview { font-family: monospace; }
  </style>
</body>
</html>
