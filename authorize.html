<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>授权 - Arctic Compass LinkAuth</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/sm3.js"></script>
  <script src="js/linkauth-core.js"></script>
</head>
<body>
  <div class="auth-page">
    <div class="auth-container">
      <h1>应用授权</h1>
      <p class="subtitle" id="appName">正在请求授权...</p>

      <div id="loadingPanel">
        <p style="text-align:center;color:var(--text-secondary);">加载中...</p>
      </div>

      <div id="authPanel" class="hidden">
        <div style="background:var(--bg-tertiary);padding:16px;border-radius:var(--border-radius);margin-bottom:16px;">
          <p style="margin:0 0 8px 0;"><strong id="appNameDisplay"></strong> 请求以下权限：</p>
          <ul style="margin:0;padding-left:20px;color:var(--text-secondary);">
            <li>获取你的基本信息（账号ID、用户名）</li>
            <li>使用你的身份进行认证</li>
          </ul>
        </div>

        <p style="font-size:0.85rem;color:var(--text-secondary);margin-bottom:16px;">
          登录账号：<strong id="loginAccount"></strong>
        </p>

        <div class="form-group hidden" id="errorContainer">
          <div class="form-error" id="errorMessage"></div>
        </div>

        <div style="display:flex;gap:12px;">
          <button id="denyBtn" class="btn btn-outline" style="flex:1;">拒绝</button>
          <button id="approveBtn" class="btn btn-primary" style="flex:1;">授权</button>
        </div>
      </div>

      <div id="resultPanel" class="hidden" style="text-align:center;padding:20px;">
        <div id="resultIcon" style="font-size:3rem;margin-bottom:12px;"></div>
        <p id="resultMessage" style="font-size:1.1rem;"></p>
      </div>
    </div>
  </div>

  <script>
    (function () {
      'use strict';
      var C = window.LinkAuthCore;

      function qp() {
        var p = {};
        (window.location.search.substring(1) || '').split('&').forEach(function (pair) {
          var parts = pair.split('=');
          if (parts.length === 2) p[decodeURIComponent(parts[0])] = decodeURIComponent(parts[1]);
        });
        return p;
      }
      var params = qp();

      var clientId = params.client_id;
      var redirectUri = params.redirect_uri;
      var state = params.state || '';
      var linkId = params.link_id;

      var loadingPanel = document.getElementById('loadingPanel');
      var authPanel = document.getElementById('authPanel');
      var resultPanel = document.getElementById('resultPanel');
      var errorContainer = document.getElementById('errorContainer');
      var errorMessage = document.getElementById('errorMessage');

      // 验证参数
      if (!clientId || !redirectUri || !linkId) {
        loadingPanel.innerHTML = '<div class="form-error">参数不完整：缺少 client_id、redirect_uri 或 link_id</div>';
        return;
      }

      var app = C.getAppInfo(clientId);
      if (!app) {
        loadingPanel.innerHTML = '<div class="form-error">应用不存在或已下架（client_id: ' + clientId.replace(/</g,'&lt;') + '）</div>';
        return;
      }

      // 验证 redirect_uri 是否在白名单中
      var uriOk = app.redirect_uris.some(function (u) { return redirectUri.indexOf(u) === 0 || redirectUri === u; });
      if (!uriOk) {
        loadingPanel.innerHTML = '<div class="form-error">回调地址不在应用白名单中</div>';
        return;
      }

      // 显示授权面板
      loadingPanel.classList.add('hidden');
      authPanel.classList.remove('hidden');
      document.getElementById('appName').textContent = app.app_name + ' 请求访问你的账号';
      document.getElementById('appNameDisplay').textContent = app.app_name;
      document.getElementById('loginAccount').textContent = linkId;

      // 批准
      document.getElementById('approveBtn').addEventListener('click', function () {
        C.approveApp(linkId, clientId);
        var code = C.createAuthCode(clientId, linkId);
        var sep = redirectUri.indexOf('?') > -1 ? '&' : '?';
        var url = redirectUri + sep + 'code=' + encodeURIComponent(code) + '&state=' + encodeURIComponent(state);

        authPanel.classList.add('hidden');
        resultPanel.classList.remove('hidden');
        document.getElementById('resultIcon').textContent = '&#10003;';
        document.getElementById('resultIcon').style.color = 'var(--accent-success)';
        document.getElementById('resultMessage').textContent = '授权成功，正在跳转...';

        setTimeout(function () { window.location.href = url; }, 800);
      });

      // 拒绝
      document.getElementById('denyBtn').addEventListener('click', function () {
        var sep = redirectUri.indexOf('?') > -1 ? '&' : '?';
        var url = redirectUri + sep + 'error=access_denied&state=' + encodeURIComponent(state);

        authPanel.classList.add('hidden');
        resultPanel.classList.remove('hidden');
        document.getElementById('resultIcon').textContent = '&#10007;';
        document.getElementById('resultIcon').style.color = 'var(--accent-danger)';
        document.getElementById('resultMessage').textContent = '已拒绝授权';

        setTimeout(function () { window.location.href = url; }, 1000);
      });
    })();
  </script>
</body>
</html>
