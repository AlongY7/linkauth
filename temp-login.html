<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>临时登录 - Arctic Compass LinkAuth</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/sm3.js"></script>
  <script src="js/linkauth-core.js"></script>
</head>
<body>
  <div class="auth-page">
    <div class="auth-container">
      <h1>一键临时登录</h1>
      <p class="subtitle">快速创建临时账号，无需注册</p>

      <div id="warningBox" style="background:var(--accent-warning-light);padding:16px;border-radius:var(--border-radius);margin-bottom:20px;border-left:4px solid var(--accent-warning);">
        <strong>注意事项：</strong>
        <ul style="margin:8px 0 0 0;padding-left:20px;font-size:0.85rem;">
          <li>仅支持临时使用，过期后自动销毁，不再支持重新认证</li>
          <li>有效期默认24小时，最多可延期3次</li>
          <li>不可转为正式账号，与正式账号体系隔离</li>
          <li>不支持登录后台（无管理密钥）</li>
          <li>不支持密码找回和管理密钥找回</li>
        </ul>
      </div>

      <div id="createPanel">
        <button id="createBtn" class="btn btn-primary btn-block">
          <span id="createText">创建临时账号</span>
        </button>
      </div>

      <div id="resultPanel" class="hidden">
        <div style="background:var(--accent-success-light);padding:16px;border-radius:var(--border-radius);margin-bottom:16px;">
          <h3 style="color:var(--accent-success);margin:0 0 8px 0;">临时账号已创建！</h3>
          <p style="margin:4px 0;"><strong>账号：</strong><code id="resultAccount" style="font-size:1rem;"></code></p>
          <p style="margin:4px 0;"><strong>密码：</strong><code id="resultPassword" style="font-size:1rem;"></code></p>
          <p style="margin:4px 0;font-size:0.85rem;color:var(--text-secondary);">有效期：24小时（过期后自动销毁）</p>
        </div>
        <button id="loginBtn" class="btn btn-primary btn-block">立即登录</button>
      </div>

      <div class="form-group hidden" id="errorContainer">
        <div class="form-error" id="errorMessage"></div>
      </div>

      <p class="text-center mt-md" style="font-size:0.85rem;">
        <a href="login.html">返回正式登录</a>
      </p>
    </div>
  </div>

  <script>
    (function () {
      'use strict';
      var C = window.LinkAuthCore;
      var tempData = null;

      var createPanel = document.getElementById('createPanel');
      var resultPanel = document.getElementById('resultPanel');
      var errorContainer = document.getElementById('errorContainer');
      var errorMessage = document.getElementById('errorMessage');
      var createBtn = document.getElementById('createBtn');
      var createText = document.getElementById('createText');

      document.getElementById('createBtn').addEventListener('click', function () {
        createBtn.disabled = true;
        createText.textContent = '创建中...';
        errorContainer.classList.add('hidden');

        setTimeout(function () {
          var r = C.createTempAccount();
          if (!r.ok) {
            errorMessage.textContent = r.error;
            errorContainer.classList.remove('hidden');
            createBtn.disabled = false;
            createText.textContent = '创建临时账号';
            return;
          }

          tempData = r;
          document.getElementById('resultAccount').textContent = r.link_id;
          document.getElementById('resultPassword').textContent = r.password;
          createPanel.classList.add('hidden');
          resultPanel.classList.remove('hidden');
        }, 500);
      });

      document.getElementById('loginBtn').addEventListener('click', function () {
        if (!tempData) return;
        // 直接登录
        var r = C.login(tempData.link_id, tempData.password);
        if (r.ok) {
          window.location.href = 'user-center.html';
        } else {
          errorMessage.textContent = r.error;
          errorContainer.classList.remove('hidden');
        }
      });
    })();
  </script>
</body>
</html>
