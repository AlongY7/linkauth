<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>找回管理密钥 - Arctic Compass LinkAuth</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/sm3.js"></script>
  <script src="js/linkauth-core.js"></script>
</head>
<body>
  <div class="auth-page">
    <div class="auth-container">
      <h1>找回管理密钥</h1>
      <p class="subtitle">四因素验证：用户名 + 账号ID + 密码 + 安全问题</p>

      <form id="recoveryForm" novalidate>
        <div class="form-group">
          <label class="form-label" for="username">用户名</label>
          <input type="text" id="username" class="form-input" placeholder="注册时的用户名（前缀部分）" required>
        </div>
        <div class="form-group">
          <label class="form-label" for="linkId">账号ID</label>
          <input type="text" id="linkId" class="form-input" placeholder="完整账号，如 Abc123@ArcticCompass_id" required>
        </div>
        <div class="form-group">
          <label class="form-label" for="password">密码</label>
          <input type="password" id="password" class="form-input" placeholder="当前密码" required>
        </div>

        <div id="questionsPanel" class="hidden">
          <p class="form-hint">请回答以下安全问题：</p>
          <div id="questionsContainer"></div>
        </div>

        <div class="form-group hidden" id="errorContainer">
          <div class="form-error" id="errorMessage"></div>
        </div>
        <div class="form-group hidden" id="successContainer">
          <div id="successMessage" style="color:var(--accent-success);padding:16px;background:var(--accent-success-light);border-radius:var(--border-radius);"></div>
        </div>

        <button type="submit" class="btn btn-primary btn-block" id="submitBtn">
          <span id="submitText">下一步</span>
        </button>
      </form>

      <p class="text-center mt-md" style="font-size:0.85rem;">
        <a href="login.html">返回登录</a>
      </p>
    </div>
  </div>

  <script>
    (function () {
      'use strict';
      var C = window.LinkAuthCore;
      var step = 1;
      var formData = {};

      var form = document.getElementById('recoveryForm');
      var submitBtn = document.getElementById('submitBtn');
      var submitText = document.getElementById('submitText');
      var errorContainer = document.getElementById('errorContainer');
      var errorMessage = document.getElementById('errorMessage');
      var successContainer = document.getElementById('successContainer');
      var successMessage = document.getElementById('successMessage');
      var questionsPanel = document.getElementById('questionsPanel');
      var questionsContainer = document.getElementById('questionsContainer');

      function showError(msg) {
        errorMessage.textContent = msg;
        errorContainer.classList.remove('hidden');
      }

      form.addEventListener('submit', function (e) {
        e.preventDefault();
        errorContainer.classList.add('hidden');
        successContainer.classList.add('hidden');

        if (step === 1) {
          var username = document.getElementById('username').value.trim();
          var linkId = document.getElementById('linkId').value.trim();
          var password = document.getElementById('password').value;

          if (!username) return showError('请输入用户名');
          if (!linkId) return showError('请输入账号ID');
          if (!password) return showError('请输入密码');

          var questions = C.getSecurityQuestions(linkId);
          if (!questions || questions.length === 0) {
            return showError('该账号未设置安全问题，无法找回管理密钥');
          }

          questionsContainer.innerHTML = questions.map(function (q, i) {
            return '<div class="form-group"><label class="form-label">' + q.question + '</label><input type="text" class="form-input sq-answer" placeholder="答案" required></div>';
          }).join('');

          formData = { username: username, linkId: linkId, password: password };
          questionsPanel.classList.remove('hidden');
          document.getElementById('username').disabled = true;
          document.getElementById('linkId').disabled = true;
          document.getElementById('password').disabled = true;
          submitText.textContent = '验证并找回密钥';
          step = 2;
        } else {
          var answers = [];
          document.querySelectorAll('.sq-answer').forEach(function (el) {
            answers.push(el.value.trim());
          });

          var r = C.recoverManagerKey(formData.username, formData.linkId, formData.password, answers);
          if (!r.ok) return showError(r.error);

          successMessage.innerHTML = '<strong>管理密钥已找回！</strong><br><br>新管理密钥：<code style="font-size:1.1rem;word-break:break-all;">' + r.manager_key + '</code><br><br><span style="color:var(--accent-danger);">请务必妥善保管，旧密钥已失效。</span>';
          successContainer.classList.remove('hidden');
          submitBtn.classList.add('hidden');
        }
      });
    })();
  </script>
</body>
</html>
