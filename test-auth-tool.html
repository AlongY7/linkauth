<body>
  <div class="app-container">
    <!-- Header -->
    <div class="app-header">
      <div>
        <h1>LinkAuth 认证授权测试工具</h1>
        <div class="subtitle">Arctic Compass LinkAuth — 全方位认证授权流程测试</div>
      </div>
      <div class="header-controls">
        <div class="server-input">
          <span class="status-dot offline" id="statusDot"></span>
          <input type="text" id="serverUrl" value="http://localhost:3000" placeholder="服务器地址">
        </div>
        <button class="primary" onclick="runAllTests()">运行全部测试</button>
        <button onclick="clearAllLogs()">清除日志</button>
      </div>
    </div>

    <!-- Summary -->
    <div class="summary-bar" id="summary">
      <div class="summary-item"><span class="count total-count" id="totalCount">0</span><span class="label">总计</span></div>
      <div class="summary-item"><span class="count pass-count" id="passCount">0</span><span class="label">通过</span></div>
      <div class="summary-item"><span class="count fail-count" id="failCount">0</span><span class="label">失败</span></div>
      <div class="summary-item"><span class="count skip-count" id="skipCount">0</span><span class="label">跳过</span></div>
    </div>

    <div class="progress-bar"><div class="fill" id="progressBar" style="width: 0%"></div></div>

    <!-- Test Cards -->
    <div class="test-grid" id="testGrid">
      <!-- Cards generated by JS -->
    </div>
  </div>

  <script>
    // ==================== Test Tool Core ====================
    const BASE_URL = () => document.getElementById('serverUrl').value;

    let csrfToken = null;
    let csrfCookie = null;
    let globalStats = { pass: 0, fail: 0, skip: 0, total: 0 };

    // Test context - shared across tests
    const ctx = {
      prefix: 'T' + Date.now().toString(36).slice(-6),
      userPassword: 'Test@Pass123!',
      userUsername: 'User_' + Date.now().toString(36).slice(-6),
      captchaToken: null,
    };

    // ==================== HTTP API ====================
    async function api(method, path, body, headers = {}) {
      const url = new URL(path, BASE_URL());
      const bodyStr = body ? JSON.stringify(body) : null;
      const reqHeaders = { 'Content-Type': 'application/json', ...headers };
      if (csrfToken) {
        reqHeaders['X-CSRF-Token'] = csrfToken;
        reqHeaders['Cookie'] = csrfCookie || '';
      }

      const res = await fetch(url.toString(), {
        method,
        headers: reqHeaders,
        body: bodyStr,
        credentials: 'include',
      });

      const setCookie = res.headers.get('set-cookie');
      if (setCookie) {
        const csrfMatch = setCookie.match(/X-CSRF-Token=([^;]+)/);
        if (csrfMatch) {
          csrfToken = csrfMatch[1];
          csrfCookie = setCookie;
        }
      }

      let data;
      try { data = await res.json(); } catch { data = await res.text(); }
      return { status: res.status, body: data };
    }

    // ==================== CAPTCHA Helper ====================
    async function getCaptchaToken() {
      const genRes = await api('POST', '/api/captcha/generate');
      if (genRes.status !== 200 || !genRes.body?.data?.captcha_id) {
        throw new Error('CAPTCHA generate failed: ' + JSON.stringify(genRes.body));
      }

      const captchaId = genRes.body.data.captcha_id;
      for (let guessX = 80; guessX <= 300; guessX += 12) {
        const trajectory = buildHumanTrajectory(guessX, 800 + Math.random() * 1200);
        const verifyRes = await api('POST', '/api/captcha/verify', {
          captcha_id: captchaId,
          x_offset: guessX,
          trajectory,
        });
        if (verifyRes.body?.data?.valid && verifyRes.body?.data?.captcha_token) {
          return verifyRes.body.data.captcha_token;
        }
        if (verifyRes.body?.data?.reason === 'captcha_expired') break;
      }
      return getCaptchaToken(); // Retry
    }

    function buildHumanTrajectory(targetX, totalTimeMs) {
      const points = 15 + Math.floor(Math.random() * 20);
      const trajectory = [];
      for (let i = 0; i < points; i++) {
        const progress = i / (points - 1);
        const ease = progress < 0.3
          ? 2.5 * progress * progress
          : 1 - Math.pow(-2 * progress + 2, 2.5) / 2;
        const x = Math.round(targetX * ease + (Math.random() - 0.5) * 1.5);
        const y = Math.round((Math.random() - 0.5) * 3);
        const t = Math.round(totalTimeMs * progress) + Math.floor(Math.random() * 25);
        trajectory.push({ x: Math.max(0, x), y, t });
      }
      return trajectory;
    }

    // ==================== Logging ====================
    function logLine(cardId, type, msg) {
      const log = document.getElementById('log-' + cardId);
      if (!log) return;
      const line = document.createElement('div');
      line.className = 'log-line ' + type;
      line.textContent = (type === 'section' ? '--- ' : '') + msg;
      log.appendChild(line);
      log.scrollTop = log.scrollHeight;
      log.classList.add('expanded');
    }

    function updateCardStatus(cardId, status) {
      const card = document.getElementById('card-' + cardId);
      const badge = document.getElementById('badge-' + cardId);
      if (!card || !badge) return;
      card.className = 'test-card ' + status;
      badge.className = 'card-badge badge-' + (status === 'running' ? 'running' : status === 'passed' ? 'pass' : 'fail');
      badge.textContent = status === 'running' ? '运行中' : status === 'passed' ? '通过' : '失败';
    }

    function updateStats() {
      document.getElementById('totalCount').textContent = globalStats.total;
      document.getElementById('passCount').textContent = globalStats.pass;
      document.getElementById('failCount').textContent = globalStats.fail;
      document.getElementById('skipCount').textContent = globalStats.skip;
      const total = globalStats.total || 1;
      document.getElementById('progressBar').style.width = (globalStats.pass / total * 100) + '%';
    }

    function assert(cardId, condition, msg) {
      globalStats.total++;
      if (condition) {
        globalStats.pass++;
        logLine(cardId, 'pass', '✓ ' + msg);
      } else {
        globalStats.fail++;
        logLine(cardId, 'fail', '✗ ' + msg);
      }
      updateStats();
      return condition;
    }

    // ==================== Test Cases ====================

    // 1. CAPTCHA
    async function testCaptcha(cardId) {
      logLine(cardId, 'section', '1. CAPTCHA 验证码系统');
      const genRes = await api('POST', '/api/captcha/generate');
      assert(cardId, genRes.status === 200, 'POST /api/captcha/generate 返回 200');
      assert(cardId, !!genRes.body?.data?.captcha_id, '返回 captcha_id');
      assert(cardId, !!genRes.body?.data?.background, '返回背景图(base64)');
      assert(cardId, !!genRes.body?.data?.slider, '返回滑块图(base64)');
      assert(cardId, genRes.body.data.width === 400, '画布宽度 400px');
      assert(cardId, genRes.body.data.slider_width === 60, '滑块宽度 60px');

      const captchaId = genRes.body.data.captcha_id;
      // Test invalid submission
      const badRes = await api('POST', '/api/captcha/verify', {
        captcha_id: captchaId, x_offset: 999, trajectory: buildHumanTrajectory(999, 500),
      });
      assert(cardId, badRes.body?.data?.valid === false, '错误位置返回 valid=false');

      logLine(cardId, 'info', 'CAPTCHA 验证码系统测试完成');
      return true;
    }

    // 2. User Registration
    async function testUserRegistration(cardId) {
      logLine(cardId, 'section', '2. 用户注册');
      const captchaToken = await getCaptchaToken();
      ctx.captchaToken = captchaToken;

      const account = ctx.prefix + '@ArcticCompass_id';
      const regRes = await api('POST', '/api/register', {
        login_account: account,
        username: ctx.userUsername,
        password: ctx.userPassword,
        captcha_token: captchaToken,
        questions: [
          { question: 'What is your favorite color?', answer: 'BlueSky2024' },
          { question: 'What city were you born in?', answer: 'TestCity2024' },
        ],
      });

      assert(cardId, regRes.status === 201, 'POST /api/register 返回 201');
      assert(cardId, !!regRes.body?.link_id, '返回 link_id');
      ctx.userLinkId = regRes.body?.link_id;
      assert(cardId, !!regRes.body?.manager_key, '返回 manager_key');
      ctx.userManagerKey = regRes.body?.manager_key;
      assert(cardId, !!regRes.body?.login_account, '返回 login_account');
      ctx.userAccount = regRes.body?.login_account;

      // Test duplicate registration
      const dupRes = await api('POST', '/api/register', {
        login_account: account,
        username: ctx.userUsername + '_dup',
        password: ctx.userPassword,
        captcha_token: await getCaptchaToken(),
        questions: [{ question: 'Test Q?', answer: 'TestA' }],
      });
      // Even if account exists, should not reveal info
      assert(cardId, dupRes.status !== 500, '重复注册不应导致服务器错误');

      logLine(cardId, 'info', '注册账号: ' + ctx.userAccount);
      logLine(cardId, 'info', 'link_id: ' + ctx.userLinkId);
      return true;
    }

    // 3. User Login
    async function testUserLogin(cardId) {
      logLine(cardId, 'section', '3. 用户登录 (login-simple)');
      const captchaToken = await getCaptchaToken();

      const loginRes = await api('POST', '/api/login-simple', {
        login_account: ctx.userAccount,
        password: ctx.userPassword,
        captcha_token: captchaToken,
      });

      assert(cardId, loginRes.status === 200, 'POST /api/login-simple 返回 200');
      assert(cardId, !!loginRes.body?.session_token, '返回 session_token');
      ctx.userSessionToken = loginRes.body?.session_token;

      // Test wrong password
      const wrongPwRes = await api('POST', '/api/login-simple', {
        login_account: ctx.userAccount,
        password: 'WrongPass123!',
        captcha_token: await getCaptchaToken(),
      });
      assert(cardId, wrongPwRes.status === 401, '错误密码返回 401');

      logLine(cardId, 'info', '登录成功，获取 session_token');
      return true;
    }

    // 4. User Center
    async function testUserCenter(cardId) {
      logLine(cardId, 'section', '4. 用户中心');

      // Verify key
      const sm3 = (await import('/js/sm3.js')).default || window.sm3;
      const keyHash = sm3 ? sm3(ctx.userManagerKey) : ctx.userManagerKey;
      const vkRes = await api('POST', '/api/user-center/verify-key', {
        link_id: ctx.userLinkId,
        manager_key_hash: keyHash,
      });
      assert(cardId, vkRes.status === 200, 'POST /api/user-center/verify-key 返回 200');
      assert(cardId, !!vkRes.body?.session_token, '返回 session_token');
      ctx.userCenterSession = vkRes.body?.session_token;

      // Get profile
      const pfRes = await api('GET', '/api/user-center/profile', null, {
        'X-Session-Token': ctx.userCenterSession,
      });
      assert(cardId, pfRes.status === 200, 'GET /api/user-center/profile 返回 200');
      assert(cardId, pfRes.body?.login_account === ctx.userAccount, 'login_account 匹配');

      // Get apps
      const appsRes = await api('GET', '/api/user-center/apps', null, {
        'X-Session-Token': ctx.userCenterSession,
      });
      assert(cardId, appsRes.status === 200, 'GET /api/user-center/apps 返回 200');
      assert(cardId, Array.isArray(appsRes.body?.apps), 'apps 是数组');

      // Get devices
      const devRes = await api('GET', '/api/user-center/devices', null, {
        'X-Session-Token': ctx.userCenterSession,
      });
      assert(cardId, devRes.status === 200, 'GET /api/user-center/devices 返回 200');

      // Get notifications
      const notifRes = await api('GET', '/api/user-center/notifications', null, {
        'X-Session-Token': ctx.userCenterSession,
      });
      assert(cardId, notifRes.status === 200, 'GET /api/user-center/notifications 返回 200');

      // Get push config
      const pushRes = await api('GET', '/api/user-center/push-config', null, {
        'X-Session-Token': ctx.userCenterSession,
      });
      assert(cardId, pushRes.status === 200, 'GET /api/user-center/push-config 返回 200');

      // Update push config
      const pushUpdRes = await api('POST', '/api/user-center/push-config', {
        session_token: ctx.userCenterSession,
        push_enabled: false,
      });
      assert(cardId, pushUpdRes.status === 200, 'POST /api/user-center/push-config 返回 200');

      logLine(cardId, 'info', '用户中心所有端点测试通过');
      return true;
    }

    // 5. Developer Account
    async function testDeveloper(cardId) {
      logLine(cardId, 'section', '5. 开发者账号');
      const captchaToken = await getCaptchaToken();
      const devPrefix = 'dev' + ctx.prefix.toLowerCase();

      const regRes = await api('POST', '/api/developer/register', {
        developer_id: devPrefix,
        password: 'Dev@Pass123!',
        captcha_token: captchaToken,
      });
      assert(cardId, regRes.status === 201, 'POST /api/developer/register 返回 201');
      assert(cardId, !!regRes.body?.developer_key, '返回 developer_key');
      ctx.developerKey = regRes.body?.developer_key;
      ctx.developerId = devPrefix;

      // Developer login
      const loginCaptcha = await getCaptchaToken();
      const loginRes = await api('POST', '/api/developer/login', {
        developer_id: devPrefix,
        password: 'Dev@Pass123!',
        captcha_token: loginCaptcha,
      });
      assert(cardId, loginRes.status === 200, 'POST /api/developer/login 返回 200');
      ctx.devSessionToken = loginRes.body?.session_token;

      logLine(cardId, 'info', '开发者账号: ' + devPrefix);
      return true;
    }

    // 6. OAuth Application Management
    async function testOAuthApps(cardId) {
      logLine(cardId, 'section', '6. OAuth 应用管理');
      if (!ctx.developerKey || !ctx.devSessionToken) {
        logLine(cardId, 'skip', '开发者未登录，跳过 OAuth 应用测试');
        globalStats.skip++; updateStats();
        return false;
      }

      const appName = 'TestApp_' + ctx.prefix;

      const createRes = await api('POST', '/api/developer/apps', {
        session_token: ctx.devSessionToken,
        app_name: appName,
        app_type: 'web',
        redirect_uris: ['https://example.com/callback'],
        description: 'Test OAuth application',
      });
      assert(cardId, createRes.status === 201, 'POST /api/developer/apps 返回 201');
      assert(cardId, !!createRes.body?.client_id, '返回 client_id');
      ctx.clientId = createRes.body?.client_id;
      assert(cardId, !!createRes.body?.client_secret, '返回 client_secret');
      ctx.clientSecret = createRes.body?.client_secret;

      // List apps
      const listRes = await api('GET', '/api/developer/apps', null, {
        'X-Session-Token': ctx.devSessionToken,
      });
      assert(cardId, listRes.status === 200, 'GET /api/developer/apps 返回 200');
      assert(cardId, Array.isArray(listRes.body?.apps), 'apps 是数组');

      logLine(cardId, 'info', 'OAuth 应用: ' + appName);
      logLine(cardId, 'info', 'client_id: ' + ctx.clientId);
      return true;
    }

    // 7. OAuth 2.0 Flow
    async function testOAuthFlow(cardId) {
      logLine(cardId, 'section', '7. OAuth 2.0 授权码流程');
      if (!ctx.clientId || !ctx.clientSecret || !ctx.userCenterSession) {
        logLine(cardId, 'skip', '缺少 OAuth 应用或用户会话，跳过');
        globalStats.skip++; updateStats();
        return false;
      }

      const state = 'test_state_' + Date.now();

      // Authorize
      const authRes = await api('POST', '/api/authorize', {
        session_token: ctx.userCenterSession,
        client_id: ctx.clientId,
        redirect_uri: 'https://example.com/callback',
        state: state,
        action: 'allow',
      });
      assert(cardId, authRes.status === 200, 'POST /api/authorize 返回 200');
      assert(cardId, !!authRes.body?.code, '返回授权码');
      ctx.oauthCode = authRes.body?.code;

      // Token exchange
      const tokenRes = await api('POST', '/api/oauth/token', {
        code: ctx.oauthCode,
        client_id: ctx.clientId,
        client_secret: ctx.clientSecret,
      });
      assert(cardId, tokenRes.status === 200, 'POST /api/oauth/token 返回 200');
      assert(cardId, !!tokenRes.body?.access_token, '返回 access_token');
      ctx.accessToken = tokenRes.body?.access_token;
      assert(cardId, !!tokenRes.body?.refresh_token, '返回 refresh_token');
      ctx.refreshToken = tokenRes.body?.refresh_token;
      assert(cardId, tokenRes.body?.token_type === 'Bearer', 'token_type 为 Bearer');

      // Refresh
      const refreshRes = await api('POST', '/api/oauth/refresh', {
        refresh_token: ctx.refreshToken,
        client_id: ctx.clientId,
      });
      assert(cardId, refreshRes.status === 200, 'POST /api/oauth/refresh 返回 200');
      assert(cardId, !!refreshRes.body?.access_token, '刷新后返回新 access_token');
      ctx.accessToken = refreshRes.body?.access_token;

      logLine(cardId, 'info', 'OAuth 2.0 授权码流程完整通过');
      return true;
    }

    // 8. MFA
    async function testMFA(cardId) {
      logLine(cardId, 'section', '8. MFA 多因素认证');
      if (!ctx.userCenterSession) {
        logLine(cardId, 'skip', '用户未登录，跳过 MFA');
        globalStats.skip++; updateStats();
        return false;
      }

      // Get MFA status
      const statusRes = await api('GET', '/api/mfa/status', null, {
        'X-Session-Token': ctx.userCenterSession,
      });
      assert(cardId, statusRes.status === 200 || statusRes.status === 404, 'GET /api/mfa/status 正常响应');

      logLine(cardId, 'info', 'MFA 端点测试完成');
      return true;
    }

    // 9. Device Management
    async function testDevice(cardId) {
      logLine(cardId, 'section', '9. 设备指纹管理');
      if (!ctx.userCenterSession) {
        logLine(cardId, 'skip', '用户未登录，跳过设备测试');
        globalStats.skip++; updateStats();
        return false;
      }

      const reportRes = await api('POST', '/api/device/report', {
        session_token: ctx.userCenterSession,
        device_type: 'browser',
        device_sign: 'test_device_' + Date.now(),
        public_key: 'test_pub_key_' + ctx.prefix,
      });
      assert(cardId, reportRes.status === 200 || reportRes.status === 201, 'POST /api/device/report 正常响应');

      logLine(cardId, 'info', '设备指纹端点测试完成');
      return true;
    }

    // 10. Temp Login
    async function testTempLogin(cardId) {
      logLine(cardId, 'section', '10. 临时账号');
      const captchaToken = await getCaptchaToken();
      const tempName = 'temp_' + ctx.prefix.toLowerCase();

      const createRes = await api('POST', '/api/temp-login/create', {
        username: tempName,
        captcha_token: captchaToken,
      });
      assert(cardId, createRes.status === 201, 'POST /api/temp-login/create 返回 201');
      ctx.tempAccount = createRes.body?.login_account || tempName;
      ctx.tempPassword = createRes.body?.password;

      if (ctx.tempPassword) {
        const captcha2 = await getCaptchaToken();
        const loginRes = await api('POST', '/api/temp-login/login', {
          login_account: ctx.tempAccount,
          password: ctx.tempPassword,
          captcha_token: captcha2,
        });
        assert(cardId, loginRes.status === 200, 'POST /api/temp-login/login 返回 200');
      }

      logLine(cardId, 'info', '临时账号: ' + ctx.tempAccount);
      return true;
    }

    // 11. Password Reset
    async function testPasswordReset(cardId) {
      logLine(cardId, 'section', '11. 密码重置');

      // Get questions
      const qRes = await api('POST', '/api/password-reset/questions', {
        login_account: ctx.userAccount,
      });
      assert(cardId, qRes.status === 200, 'POST /api/password-reset/questions 返回 200');
      assert(cardId, Array.isArray(qRes.body?.questions), '返回安全问题列表');

      // Test non-existent user (should still return fake questions)
      const fakeQRes = await api('POST', '/api/password-reset/questions', {
        login_account: 'nonexistent_user_99999',
      });
      assert(cardId, fakeQRes.status === 200, '不存在的用户也应返回 200（防枚举）');
      assert(cardId, Array.isArray(fakeQRes.body?.questions), '不存在的用户返回假问题列表');

      logLine(cardId, 'info', '密码重置端点测试完成（防用户枚举）');
      return true;
    }

    // 12. Manager Key Recovery
    async function testManagerKeyRecovery(cardId) {
      logLine(cardId, 'section', '12. 管理密钥恢复');
      const captchaToken = await getCaptchaToken();

      const recRes = await api('POST', '/api/user-center/recover-key', {
        username: ctx.userUsername,
        link_id: ctx.userLinkId,
        password: ctx.userPassword,
        captcha_token: captchaToken,
        answers: [
          { sort: 1, answer: 'BlueSky2024' },
          { sort: 2, answer: 'TestCity2024' },
        ],
      });
      assert(cardId, recRes.status === 200, 'POST /api/user-center/recover-key 返回 200');
      assert(cardId, !!recRes.body?.manager_key, '返回新 manager_key');
      ctx.userManagerKey = recRes.body?.manager_key;

      logLine(cardId, 'info', '管理密钥恢复成功');
      return true;
    }

    // 13. Admin Operations
    async function testAdmin(cardId) {
      logLine(cardId, 'section', '13. 管理员操作');
      if (!ctx.userLinkId || !ctx.userManagerKey) {
        logLine(cardId, 'skip', '用户未注册，跳过管理员测试');
        globalStats.skip++; updateStats();
        return false;
      }

      const sm3fn = (window.sm3) ? window.sm3 : (s) => s;
      const keyHash = sm3fn(ctx.userManagerKey);

      // Check role
      const roleRes = await api('GET', '/api/admin/my-role?session_token=' + ctx.userCenterSession);
      assert(cardId, roleRes.status === 200, 'GET /api/admin/my-role 返回 200');
      assert(cardId, !!roleRes.body?.role, '返回角色信息');

      // User list (requires admin role, may fail for regular users)
      const usersRes = await api('GET', '/api/admin/users', null, {
        'Content-Type': 'application/json',
      });
      // This will likely fail because user is not admin - that's OK
      logLine(cardId, 'info', 'GET /api/admin/users: ' + usersRes.status + ' (需要管理员权限)');

      // Stats (requires admin role)
      const statsRes = await api('GET', '/api/admin/stats', null, {
        'Content-Type': 'application/json',
      });
      logLine(cardId, 'info', 'GET /api/admin/stats: ' + statsRes.status + ' (需要管理员权限)');

      assert(cardId, roleRes.status === 200, '管理员端点结构正确');
      return true;
    }

    // 14. Security Headers
    async function testSecurityHeaders(cardId) {
      logLine(cardId, 'section', '14. 安全响应头');
      const res = await api('GET', '/');
      const headers = res.headers || {};

      // Check via fetch directly
      const rawRes = await fetch(BASE_URL() + '/');
      const rawHeaders = {};
      rawRes.headers.forEach((v, k) => { rawHeaders[k.toLowerCase()] = v; });

      assert(cardId, rawHeaders['x-content-type-options'] === 'nosniff', 'X-Content-Type-Options: nosniff');
      assert(cardId, rawHeaders['x-frame-options'] === 'DENY', 'X-Frame-Options: DENY');
      assert(cardId, rawHeaders['referrer-policy'] === 'no-referrer', 'Referrer-Policy: no-referrer');
      assert(cardId, !!rawHeaders['content-security-policy'], 'Content-Security-Policy 已设置');
      assert(cardId, rawHeaders['x-permitted-cross-domain-policies'] === 'none', 'X-Permitted-Cross-Domain-Policies: none');
      assert(cardId, rawHeaders['cross-origin-opener-policy'] === 'same-origin', 'Cross-Origin-Opener-Policy: same-origin');

      logLine(cardId, 'info', '安全响应头全部正确');
      return true;
    }

    // 15. Health Check
    async function testHealthCheck(cardId) {
      logLine(cardId, 'section', '15. 健康检查');
      const res = await api('GET', '/health');
      assert(cardId, res.status === 200, 'GET /health 返回 200');
      assert(cardId, res.body?.status === 'ok', 'status 为 ok');
      assert(cardId, !!res.body?.timestamp, '包含 timestamp');
      logLine(cardId, 'info', '健康检查通过');
      return true;
    }

    // 16. Public Key
    async function testPublicKey(cardId) {
      logLine(cardId, 'section', '16. RSA 公钥');
      const res = await api('GET', '/api/public-key');
      assert(cardId, res.status === 200, 'GET /api/public-key 返回 200');
      assert(cardId, !!res.body?.publicKey, '返回 publicKey');
      assert(cardId, res.body.publicKey.includes('-----BEGIN'), '公钥格式正确');
      logLine(cardId, 'info', 'RSA 公钥获取成功');
      return true;
    }

    // ==================== Test Runner ====================
    const testSuites = [
      { id: 'health', name: '健康检查', fn: testHealthCheck },
      { id: 'security', name: '安全响应头', fn: testSecurityHeaders },
      { id: 'pubkey', name: 'RSA 公钥', fn: testPublicKey },
      { id: 'captcha', name: 'CAPTCHA 验证码', fn: testCaptcha },
      { id: 'register', name: '用户注册', fn: testUserRegistration },
      { id: 'login', name: '用户登录', fn: testUserLogin },
      { id: 'usercenter', name: '用户中心', fn: testUserCenter },
      { id: 'developer', name: '开发者账号', fn: testDeveloper },
      { id: 'oauthapps', name: 'OAuth 应用管理', fn: testOAuthApps },
      { id: 'oauthflow', name: 'OAuth 2.0 流程', fn: testOAuthFlow },
      { id: 'mfa', name: 'MFA 多因素认证', fn: testMFA },
      { id: 'device', name: '设备指纹', fn: testDevice },
      { id: 'templogin', name: '临时账号', fn: testTempLogin },
      { id: 'pwreset', name: '密码重置', fn: testPasswordReset },
      { id: 'keyrecovery', name: '管理密钥恢复', fn: testManagerKeyRecovery },
      { id: 'admin', name: '管理员操作', fn: testAdmin },
    ];

    function buildTestGrid() {
      const grid = document.getElementById('testGrid');
      grid.innerHTML = '';
      testSuites.forEach(suite => {
        const card = document.createElement('div');
        card.className = 'test-card';
        card.id = 'card-' + suite.id;
        card.innerHTML = `
          <div class="card-header">
            <h3>${suite.name}</h3>
            <span class="card-badge badge-idle" id="badge-${suite.id}">待测试</span>
          </div>
          <div class="card-actions">
            <button onclick="runSingleTest('${suite.id}')">运行此测试</button>
            <button onclick="toggleLog('${suite.id}')">日志</button>
          </div>
          <div class="card-log" id="log-${suite.id}"></div>
        `;
        grid.appendChild(card);
      });
    }

    function toggleLog(cardId) {
      const log = document.getElementById('log-' + cardId);
      if (log) log.classList.toggle('expanded');
    }

    async function runSingleTest(suiteId) {
      const suite = testSuites.find(s => s.id === suiteId);
      if (!suite) return;

      updateCardStatus(suiteId, 'running');
      const log = document.getElementById('log-' + suiteId);
      if (log) log.innerHTML = '';

      try {
        await suite.fn(suiteId);
        updateCardStatus(suiteId, 'passed');
      } catch (err) {
        logLine(suiteId, 'fail', '异常: ' + err.message);
        updateCardStatus(suiteId, 'failed');
      }
    }

    async function runAllTests() {
      globalStats = { pass: 0, fail: 0, skip: 0, total: 0 };
      updateStats();

      document.getElementById('statusDot').className = 'status-dot testing';

      for (const suite of testSuites) {
        await runSingleTest(suite.id);
        // Small delay between tests
        await new Promise(r => setTimeout(r, 200));
      }

      document.getElementById('statusDot').className = 'status-dot ' + (globalStats.fail === 0 ? 'online' : 'offline');
      updateStats();
    }

    function clearAllLogs() {
      testSuites.forEach(s => {
        const log = document.getElementById('log-' + s.id);
        if (log) log.innerHTML = '';
        updateCardStatus(s.id, '');
        document.getElementById('badge-' + s.id).textContent = '待测试';
        document.getElementById('badge-' + s.id).className = 'card-badge badge-idle';
      });
      globalStats = { pass: 0, fail: 0, skip: 0, total: 0 };
      updateStats();
      document.getElementById('statusDot').className = 'status-dot offline';
    }

    // Check server status on load
    async function checkServer() {
      try {
        const res = await api('GET', '/health');
        if (res.status === 200) {
          document.getElementById('statusDot').className = 'status-dot online';
        }
      } catch {
        document.getElementById('statusDot').className = 'status-dot offline';
      }
    }

    // Init
    buildTestGrid();
    checkServer();
  </script>
</body>
